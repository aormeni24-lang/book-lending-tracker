<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Lending Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="ui-body">
  <header class="ui-header">
    <div class="ui-container ui-center">
      <h1 class="ui-title">Book Lending Tracker</h1>
      <p class="ui-subtitle">Keep track of the books you have lent out.</p>
    </div>
  </header>

  <main class="ui-container ui-stack">

    <!-- Summary area -->
    <section class="ui-grid ui-grid-2 ui-center" aria-label="Summary">
      <div class="ui-card ui-stat">
        <span class="ui-stat-label">Total loans</span>
        <span class="ui-stat-value" id="total-loans">0</span>
      </div>
      <div class="ui-card ui-stat ui-stat-danger">
        <span class="ui-stat-label">Overdue loans</span>
        <span class="ui-stat-value" id="overdue-loans">0</span>
      </div>
    </section>

    <div class="ui-layout">
    <!-- Form -->
    <section class="ui-card ui-sticky">
      <h2 class="ui-card-title">Lend a book</h2>
      <form id="loan-form" class="ui-grid ui-grid-1" novalidate>
        <div class="ui-field">
          <label class="ui-label" for="title">Title</label>
          <input class="ui-input" type="text" id="title" name="title" placeholder="e.g. Dune">
          <span class="ui-error" id="title-error" role="alert"></span>
        </div>
        <div class="ui-field">
          <label class="ui-label" for="author">Author</label>
          <input class="ui-input" type="text" id="author" name="author" placeholder="e.g. Frank Herbert">
          <span class="ui-error" id="author-error" role="alert"></span>
        </div>
        <div class="ui-field">
          <label class="ui-label" for="borrower">Borrower</label>
          <input class="ui-input" type="text" id="borrower" name="borrower" placeholder="e.g. Elira">
          <span class="ui-error" id="borrower-error" role="alert"></span>
        </div>
        <div class="ui-field">
          <label class="ui-label" for="dueDate">Due date</label>
          <input class="ui-input" type="date" id="dueDate" name="dueDate">
          <span class="ui-error" id="dueDate-error" role="alert"></span>
        </div>
        <div class="ui-field">
          <label class="ui-label" for="genre">Genre</label>
          <select class="ui-input" id="genre" name="genre">
            <option value="">Select a genre</option>
            <option>Fiction</option>
            <option>Non-fiction</option>
            <option>Science fiction</option>
            <option>Fantasy</option>
            <option>Mystery</option>
            <option>Biography</option>
            <option>History</option>
            <option>Science</option>
            <option>Other</option>
          </select>
          <span class="ui-error" id="genre-error" role="alert"></span>
        </div>
        <div class="ui-field ui-field-action">
          <button class="ui-btn ui-btn-primary ui-btn-block" type="submit">Add loan</button>
        </div>
      </form>
    </section>

    <!-- Table -->
    <section class="ui-card">
      <h2 class="ui-card-title">Lent books</h2>
      <div class="ui-table-wrap">
        <table class="ui-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Borrower</th>
              <th>Due date</th>
              <th>Genre</th>
              <th class="ui-col-center">Status</th>
              <th class="ui-col-center">Action</th>
            </tr>
          </thead>
          <tbody id="loan-table-body"></tbody>
        </table>
      </div>
      <p class="ui-empty" id="empty-message">No books lent yet. Add one above.</p>
    </section>
    </div>
  </main>

  <footer class="ui-footer">
    <div class="ui-container">Book Lending Tracker &middot; HTML, CSS &amp; JavaScript</div>
  </footer>

  <script src="app.js"></script>
  <script>
    BookLending.init({
      form: "#loan-form",
      tableBody: "#loan-table-body",
      emptyMessage: "#empty-message",
      totalEl: "#total-loans",
      overdueEl: "#overdue-loans"
    });
  </script>
</body>
</html>
