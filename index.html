<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Lending Tracker</title>
  <!-- The only stylesheet: our CSS library -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page">
  <header class="header p-lg">
    <div class="container text-center">
      <h1 class="h1">Book Lending Tracker</h1>
      <p class="header-subtitle">Keep track of the books you have lent out.</p>
    </div>
  </header>

  <main class="container main stack">
    <!-- Summary area -->
    <section class="grid grid-2" aria-label="Summary">
      <div class="card stat items-center text-center">
        <span class="stat-label">Total loans</span>
        <span class="stat-value text-primary" id="total-loans">0</span>
      </div>
      <div class="card stat items-center text-center">
        <span class="stat-label">Overdue loans</span>
        <span class="stat-value text-danger" id="overdue-loans">0</span>
      </div>
    </section>

    <div class="grid grid-sidebar">
      <section class="card sticky">
        <h2 class="h2">Lend a book</h2>
        <form id="loan-form" class="grid grid-1" novalidate>
          <div class="field">
            <label class="label" for="title">Title</label>
            <input class="input" type="text" id="title" name="title" placeholder="e.g. Dune">
            <span class="error-text" data-error-for="title" role="alert"></span>
          </div>
          <div class="field">
            <label class="label" for="author">Author</label>
            <input class="input" type="text" id="author" name="author" placeholder="e.g. Frank Herbert">
            <span class="error-text" data-error-for="author" role="alert"></span>
          </div>
          <div class="field">
            <label class="label" for="borrower">Borrower</label>
            <input class="input" type="text" id="borrower" name="borrower" placeholder="e.g. Elira">
            <span class="error-text" data-error-for="borrower" role="alert"></span>
          </div>
          <div class="field">
            <label class="label" for="dueDate">Due date</label>
            <input class="input" type="date" id="dueDate" name="dueDate">
            <span class="error-text" data-error-for="dueDate" role="alert"></span>
          </div>
          <div class="field">
            <label class="label" for="genre">Genre</label>
            <select class="input" id="genre" name="genre">
              <option value="">Select a genre</option>
              <option>Fiction</option>
              <option>Non-fiction</option>
              <option>Science fiction</option>
              <option>Fantasy</option>
              <option>Mystery</option>
              <option>Biography</option>
              <option>History</option>
              <option>Science</option>
              <option>Other</option>
            </select>
            <span class="error-text" data-error-for="genre" role="alert"></span>
          </div>
          <div class="field justify-end">
            <button class="btn btn-primary btn-block" type="submit">Add loan</button>
          </div>
        </form>
      </section>
      <section class="card">
        <h2 class="h2">Lent books</h2>
        <div class="table-wrap table-bordered">
          <table class="table">
            <thead class="table-head-muted">
              <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Borrower</th>
                <th>Due date</th>
                <th>Genre</th>
                <th class="text-center">Status</th>
                <th class="text-center">Action</th>
              </tr>
            </thead>
            <tbody id="loan-table-body"></tbody>
          </table>
        </div>
        <p class="text-muted text-center mt-2 m-0" id="empty-message">No books lent yet. Add one above.</p>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">Book Lending Tracker &middot; HTML, CSS &amp; JavaScript</div>
  </footer>

  <!-- 1) the JavaScript library, 2) the app that uses it -->
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
